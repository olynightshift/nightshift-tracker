<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nightshift-tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Version watcher: phones (especially iOS home-screen icons) can hold a
      // cached copy of this HTML and never pick up new deployments. Poll the
      // served HTML, compare the JS bundle hash with the one we booted from,
      // and offer a one-tap reload when a newer build exists.
      (function () {
        var banner = null;
        function currentHash() {
          var m = document.querySelector('script[type="module"][src*="assets/index-"]');
          var mm = m && /assets\/index-([A-Za-z0-9_-]+)\.js/.exec(m.src);
          return mm ? mm[1] : null;
        }
        function showBanner() {
          if (banner) return;
          banner = document.createElement('div');
          banner.textContent = 'A new version of Nightshift is ready — tap here to update';
          banner.setAttribute('style', 'position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#f59e0b;color:#0f172a;font:600 14px/1.4 system-ui,sans-serif;text-align:center;padding:12px 16px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);');
          banner.addEventListener('click', function () { location.reload(); });
          document.documentElement.appendChild(banner);
        }
        async function check() {
          try {
            if (document.hidden) return;
            var mine = currentHash();
            if (!mine) return;
            var res = await fetch(location.pathname + '?vcheck=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) return;
            var html = await res.text();
            var mm = /assets\/index-([A-Za-z0-9_-]+)\.js/.exec(html);
            if (mm && mm[1] !== mine) showBanner();
          } catch (e) { /* offline or blocked — try again next round */ }
        }
        window.addEventListener('load', function () {
          setTimeout(check, 8000);
          setInterval(check, 300000);
        });
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) setTimeout(check, 500);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
